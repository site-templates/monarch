title: Process rail
description: Numbered steps with oversized hollow numerals on a connecting hairline
fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "How we work"
    heading:
        type: text
        label: Heading
        default: "Three moves, repeated until it ships."
    steps:
        type: repeater
        label: Steps
        add_button_label: "Add step"
        item_label: title
        sub_fields:
            number:
                type: text
                label: Numeral
                default: "04"
            kicker:
                type: text
                label: Kicker
                description: The small uppercase label above the step title.
                default: "Week 1"
            title:
                type: text
                label: Title
                default: "New step"
            description:
                type: textarea
                label: Description
                rows: 3
                default: "What happens during this step and what comes out of it."
